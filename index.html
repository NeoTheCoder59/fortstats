<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fortstats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1A1816">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <a class="logo" href="/" id="logo" aria-label="Fortstats, retour à l'accueil">
        <svg viewBox="0 0 32 32" width="34" height="34" aria-hidden="true">
          <circle cx="16" cy="16" r="12" fill="none" stroke="currentColor" stroke-opacity=".3" stroke-width="3.5"/>
          <path d="M16 4 A12 12 0 0 1 25.7 8.9" fill="none" stroke="var(--brass)" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="16" cy="16" r="3" fill="var(--brass)"/>
        </svg>
        <span>Fortstats</span>
      </a>
      <form id="form" class="search">
        <fieldset class="seg">
          <legend class="sr">Plateforme</legend>
          <label><input type="radio" name="platform" value="epic" checked><span>Epic</span></label>
          <label><input type="radio" name="platform" value="psn"><span>PS</span></label>
          <label><input type="radio" name="platform" value="xbl"><span>Xbox</span></label>
        </fieldset>
        <label class="sr" for="name">Pseudo</label>
        <input id="name" required maxlength="64" placeholder="Ton pseudo" autocomplete="off">
        <button type="submit">Voir mes stats</button>
      </form>
      <nav id="nav" class="nav" aria-label="Sections"></nav>
      <p class="hint">Tes statistiques doivent être publiques dans les paramètres de confidentialité de Fortnite.</p>
    </aside>
    <main id="out" class="main" aria-live="polite"></main>
  </div>
  <script src="extras.js"></script>
  <script src="app.js"></script>
</body>
</html>
